<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Maidaan: local football tournaments, live scores and live streams."
    />
    <meta name="theme-color" content="#0F7B3F" />
    <link rel="icon" type="image/svg+xml" href="/maidaan-icon.svg" />
    <title>Maidaan</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a light flash in dark mode
      (function () {
        var mode = "system";
        try {
          mode = localStorage.getItem("maidaan.theme") || "system";
        } catch (e) {}
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (mode === "dark" || (mode === "system" && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
